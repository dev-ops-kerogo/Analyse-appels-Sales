 const CLIENT_ID="115983769399-mk3pgclco86g5r9nruou7vj5ku7u3nvm.apps.googleusercontent.com",API=window.IC_API_URL,PAGE=window.IC_PAGE;

 if(!valide(JETON))JETON=null;
 const info=valide(JETON);window.__UID=info?String(info.email).toLowerCase():"";
 /* écran de connexion */
 const css=document.createElement("style");css.textContent='#icLogin{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:#F3F3F8;font-family:"Instrument Sans",Arial,sans-serif;padding:20px}#icLogin.on{display:flex}#icLogin .b{background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(7,6,43,.14);padding:34px 36px;max-width:440px;width:100%;text-align:center;color:#07062B}#icLogin h1{font-size:22px;margin:0 0 8px}#icLogin p{color:#5B5A7A;margin:0 0 20px;line-height:1.5}#icLogin .gb{display:flex;justify-content:center;min-height:44px}#icLogin .err{color:#D64A35;margin:14px 0 0;font-size:14px}@media (prefers-color-scheme:dark){#icLogin{background:#07062B}#icLogin .b{background:#1C1A66;color:#fff}#icLogin p{color:#C9C8E8}}#icOut{position:fixed;left:14px;bottom:12px;z-index:50;font:12px Arial,sans-serif;color:#5B5A7A;background:none;border:0;cursor:pointer;text-decoration:underline}';
 document.head.appendChild(css);
 const ecran=()=>{let d=document.getElementById("icLogin");if(!d){d=document.createElement("div");d.id="icLogin";d.innerHTML='<div class="b"><h1>'+(PAGE==="coaching"?"Mon coaching":"Performance des appels sales")+'</h1><p>Connectez-vous avec votre compte Google <b>@kerogo.com</b> ou <b>@keobiz.fr</b>.</p><div class="gb" id="icGBtn"></div><p class="err" id="icErr"></p></div>';(document.body||document.documentElement).appendChild(d);}return d;};
 let attente=null,resoudre=null;
 const gisPret=()=>new Promise(r=>{const t=()=>window.google&&google.accounts&&google.accounts.id?r():setTimeout(t,100);t();});
 let gisInit=false;
 const initGis=async()=>{await gisPret();if(gisInit)return;gisInit=true;google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,cancel_on_tap_outside:false,callback:rep=>{const p=lire(rep.credential);

   JETON=rep.credential;try{localStorage.setItem(K,JETON);}catch(e){}const neuf=String(p.email).toLowerCase();const change=window.__UID&&window.__UID!==neuf;window.__UID=neuf;ecran().classList.remove("on");
   if(change){location.reload();return;}if(resoudre){resoudre(JETON);resoudre=null;attente=null;}}});};
 const connexion=()=>{if(attente)return attente;attente=new Promise(r=>{resoudre=r;});(async()=>{const d=ecran();d.classList.add("on");await initGis();
   google.accounts.id.renderButton(document.getElementById("icGBtn"),{theme:"outline",size:"large",text:"signin_with",shape:"pill",locale:"fr"});google.accounts.id.prompt();})();return attente;};
 const jeton=async()=>valide(JETON)?JETON:connexion();
 window.icDeconnexion=()=>{try{localStorage.removeItem(K);}catch(e){}JETON=null;try{google.accounts.id.disableAutoSelect();}catch(e){}location.reload();};
 /* appel du serveur */
 let PREF=null;
 async function api(fn,args,essai){

  const m={fn,connexion:Math.round(t1-t0),total:Math.round(performance.now()-t0),serveur:r.ms?r.ms.total:null,verification:r.ms?r.ms.verif:null,mode:r.ms?r.ms.mode:"",ko:Math.round(taille/1024)};

  const v=r.ok;if(fn==="bootstrap")marquerVu();
  if(fn==="bootstrap"&&PAGE==="dashboard"&&v&&v.me){if(v.me.role==="commercial"){location.replace("coaching.html");return new Promise(()=>{});}
   if(!v.me.role){const d=ecran();d.querySelector(".b").innerHTML='<h1>Accès réservé</h1><p>Le compte <b>'+(v.me.id||window.__UID)+'</b> n’a pas encore accès au tableau de bord. Demandez à l’équipe Dev Ops de vous ajouter.</p><button onclick="icDeconnexion()" style="padding:10px 18px;border-radius:999px;border:1px solid #433FC1;background:#fff;color:#433FC1;cursor:pointer">Changer de compte</button>';d.classList.add("on");return new Promise(()=>{});}}
  return v;}
 /* chargement anticipé des données, dès l'ouverture, en parallèle du reste de la page */
 if(valide(JETON)){const vu=(()=>{try{return localStorage.getItem("ic_vu_"+window.__UID);}catch(e){return null;}})();
  if(PAGE==="coaching")PREF={fn:"getData",p:api("getData",[])};

  if(PREF){PREF.p.catch(()=>{});const f=PREF;PREF=null;PREF=f;}}
 const marquerVu=()=>{try{localStorage.setItem("ic_vu_"+window.__UID,"1");}catch(e){}};
 /* ?debug dans l'adresse : affiche le détail des temps de chargement */
 function montrer(){let d=document.getElementById("icDebug");if(!d){d=document.createElement("pre");d.id="icDebug";d.style.cssText="position:fixed;right:10px;bottom:10px;z-index:9999;background:#07062B;color:#fff;font:12px/1.5 monospace;padding:10px 12px;border-radius:10px;max-width:520px;white-space:pre-wrap";document.body.appendChild(d);}
  d.textContent="Depuis l’ouverture : "+Math.round(performance.now())+" ms\n"+window.__icMesures.map(m=>m.fn+" · total "+m.total+" ms · serveur "+(m.serveur??"?")+" ms (vérif. "+(m.verification??"?")+") · connexion "+m.connexion+" ms · "+m.ko+" Ko"+(m.mode?" · "+m.mode:"")).join("\n");}
 /* google.script.run : même usage que dans Apps Script, mais par Internet */
 const runner=(ok,ko)=>new Proxy({},{get(_,p){if(p==="withSuccessHandler")return f=>runner(f,ko);if(p==="withFailureHandler")return f=>runner(ok,f);if(p==="withUserObject")return()=>runner(ok,ko);

 const SCRIPT={get run(){return runner(null,null);},url:{getLocation:cb=>cb({parameter:Object.fromEntries(new URLSearchParams(location.search)),hash:location.hash.slice(1)})}};

 let n=0;const iv=setInterval(()=>{garder();if(++n>100)clearInterval(iv);},100); /* la bibliothèque Google peut remplacer l'objet google en se chargeant */
 document.addEventListener("DOMContentLoaded",()=>{const b=document.createElement("button");b.id="icOut";b.textContent="Changer de compte";b.onclick=window.icDeconnexion;document.body.appendChild(b);});
})();

<style>
:root{--bg:#F3F5F4;--card:#FFFFFF;--line:#E3E8E5;--line2:#EEF2F0;--ink:#0D0B4C;--navy:#2A286B;--muted:#6B7385;--brand:#1E9E6A;--brand-soft:#E3F5EC;--lost:#D64A35;--lost-soft:#FBEAE6;--amber:#B7791F;--amber-soft:#FBF1DF;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0E1424;--card:#151D33;--line:#26304A;--line2:#1E2740;--ink:#E8ECF6;--navy:#DAD9FA;--muted:#97A1B8;--brand:#62E8AB;--brand-soft:rgba(98,232,171,.18);--lost:#FF8A75;--lost-soft:#3A1F1C;--amber:#FFC75A;--amber-soft:#3A2E14;color-scheme:dark}

:root[data-theme="dark"] tbody tr:hover{background:#2C2A7A}:root[data-theme="dark"] .btn{background:#433FC1}:root[data-theme="dark"] .drawer,:root[data-theme="dark"] .panel{background:var(--card)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.n{font-family:"Bricolage Grotesque","Instrument Sans",Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
/* barre supérieure */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1320px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-size:14px;color:var(--navy)}

.run{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#2A286B}

.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:20px}

.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch h2{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}

.ch .side{font-size:12px;color:var(--muted);white-space:nowrap}

pre.tr{white-space:pre-wrap;font:13px/1.6 "Instrument Sans",Arial,sans-serif;background:var(--bg);border-radius:10px;padding:14px;max-height:380px;overflow:auto}

.eqpill{display:inline-block;padding:2px 9px;border-radius:999px;background:#E3E8F8;color:#2A286B;font-weight:700;font-size:12px}
:root[data-theme="dark"] .eqpill{background:#2A286B;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eqpill{background:#2A286B;color:#fff}}
.avg{background:#2A286B!important;color:#fff!important;border:0!important}.avg b{color:#F6C832!important}.avg span{color:#E3E2F7!important}
.hb.w i{background:var(--pos)!important}.seg button[data-res="Gagné"][aria-pressed="true"]{background:var(--pos)!important;border-color:var(--pos)!important;color:#fff!important}
/* « À retenir » : plus compact, chiffres néon, sans lueur */
.banner{min-height:0!important;padding:0!important}.banner::after,.banner::before{display:none!important;content:none!important}
.banner .it,.banner .ttl{padding:10px 14px!important}.banner .it b.n,.banner b.n{font-size:28px!important;color:#F6C832!important;text-shadow:none!important}
.banner h2,.banner .ttl{font-size:12px!important}
#tabs{margin-bottom:14px}
.xclose{position:static!important;margin-left:6px}
.bf.h .w{color:var(--pos)!important}.hb.w *:not(i){color:var(--pos)!important}
:root[data-theme="dark"]{--pos:#62E8AB;--pos-soft:rgba(98,232,171,.2);--lost:#FF8A75;--lost-soft:rgba(255,138,117,.18);--amber:#FFC75A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pos:#62E8AB;--pos-soft:rgba(98,232,171,.2);--lost:#FF8A75;--lost-soft:rgba(255,138,117,.18);--amber:#FFC75A}}
/* pastilles de niveau bien distinctes */
.lv.maitrise{background:#E3F5EC!important;color:#1E9E6A!important}.lv.acquisition{background:#FCF1DA!important;color:#A0690A!important;border-color:transparent!important}
.lv.non_acquis{background:#FBE9E5!important;color:#BE3C28!important}.lv.non_evalue{background:transparent!important;border:1.5px dashed #9AA3B5!important;color:var(--muted)!important}
:root[data-theme="dark"] .lv.maitrise{background:rgba(98,232,171,.18)!important;color:#62E8AB!important}:root[data-theme="dark"] .lv.acquisition{background:rgba(255,199,90,.2)!important;color:#FFC75A!important}
:root[data-theme="dark"] .lv.non_acquis{background:rgba(255,138,117,.2)!important;color:#FF8A75!important}:root[data-theme="dark"] .lv.non_evalue{border-color:#8F96B8!important;color:#C9CCE0!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv.maitrise{background:rgba(98,232,171,.18)!important;color:#62E8AB!important}:root:not([data-theme="light"]) .lv.acquisition{background:rgba(255,199,90,.2)!important;color:#FFC75A!important}:root:not([data-theme="light"]) .lv.non_acquis{background:rgba(255,138,117,.2)!important;color:#FF8A75!important}}
:root{--q2:#3B82F6}:root[data-theme="dark"]{--q2:#7FB0FF}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--q2:#7FB0FF}}
/* moyenne de l'équipe : un point au lieu d'un trait */
.bar.tick u{width:10px!important;height:10px!important;top:50%!important;border-radius:50%!important;transform:translate(-50%,-50%);border:2px solid var(--card);box-sizing:border-box}
/* ===== Charte Kerogo Finance (accueil du tableau de bord) ===== */
:root{--bg:#F3F3F8;--card:#FFFFFF;--line:#E2E2EE;--line2:#EEEEF6;--ink:#0D0B4C;--navy:#2A286B;--muted:#5E5D82;--brand:#433FC1;--brand-soft:#ECEBFA;--team:#2A286B;--accent:#F6C832}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07062B;--card:#1C1A66;--line:#3D3B94;--line2:#2C2A7A;--ink:#FFFFFF;--navy:#DAD9FA;--muted:#CFCEEE;--brand:#B4B2FF;--brand-soft:#2A286B;--team:#DAD9FA}}
:root[data-theme="dark"]{--bg:#07062B;--card:#1C1A66;--line:#3D3B94;--line2:#2C2A7A;--ink:#FFFFFF;--navy:#DAD9FA;--muted:#CFCEEE;--brand:#B4B2FF;--brand-soft:#2A286B;--team:#DAD9FA}
*{font-family:"Inter",Arial,sans-serif!important}
.brand img.kg{width:auto;height:48px;border-radius:0}.brand .kg-d{display:none}
:root[data-theme="dark"] .brand .kg-l{display:none}:root[data-theme="dark"] .brand .kg-d{display:block}

.brand span{display:inline!important;color:var(--navy);font-weight:600;font-size:13px;border-left:1px solid var(--line);padding-left:12px}
.banner{background:#2A286B!important;box-shadow:none!important}.banner::before{display:none!important}
.banner .it b.n,.banner b.n{color:#F6C832!important}
.btn{background:#2A286B}.btn.green{background:#433FC1;color:#fff}
h1,h2,h3{color:var(--navy)}
.kpi,.card{box-shadow:none!important}
.cabsel{font-weight:600}
#run{display:none!important}

<script>
/* Pont Apps Script : un seul échange au chargement, et affichage immédiat depuis le cache du navigateur */
(function(){
 const showErr=(fn,m)=>{console.error("Apps Script",fn,m);let b=document.getElementById("srvErr");if(!b){b=document.createElement("div");b.id="srvErr";b.setAttribute("role","alert");b.style.cssText="position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#FBE9E5;color:#9B2C1C;border:1px solid #E7A99B;border-radius:12px;padding:12px 16px;font:600 14px/1.45 Inter,Arial,sans-serif;white-space:pre-wrap";document.body.appendChild(b);}b.textContent+=(b.textContent?"\n":"")+"Erreur serveur ("+fn+") : "+m;};
 const call=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>{const m=String(e&&e.message||e);showErr(fn,m);rej({code:"server",message:m});})[fn](...a));
 window.addEventListener("error",e=>{const el=document.getElementById("sub");if(el&&/Chargement/.test(el.textContent))el.textContent="Erreur d’affichage : "+e.message;});
 window.__loaded={};const L={},DATA={};let ME=null,FRESH=false;
 const emit=n=>{const rows=DATA[n]||[];(L[n]||[]).forEach(cb=>cb({docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data}))}));};
 const idb=()=>new Promise(res=>{try{const r=indexedDB.open("ic-cache",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});
 const ckey=()=>window.__UID?"boot:"+window.__UID:null;
 const cacheGet=async()=>{const d=await idb(),k=ckey();if(!d||!k)return null;return new Promise(res=>{try{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});};
 const cacheSet=async v=>{const d=await idb(),k=ckey();if(!d||!k)return;try{d.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}};
 const apply=b=>{if(!b||!b.cols)return;ME=b.me;window.__HEBDO=b.hebdo||null;Object.keys(b.cols).forEach(n=>{DATA[n]=b.cols[n];window.__loaded[n]=true;});window.__batch=true;try{Object.keys(L).forEach(emit);}finally{window.__batch=false;}if(typeof window.render==="function")window.render();};
 /* 1) affichage immédiat depuis le cache du navigateur ; 2) le serveur n'envoie que les fiches analysées depuis la dernière visite */
 const note=t=>{const sub=document.getElementById("sub");if(!sub)return;let e=document.getElementById("syncNote");if(!e){e=document.createElement("span");e.id="syncNote";e.style.cssText="margin-left:10px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)";sub.after(e);}e.textContent=t;e.hidden=!t;};
 const CACHED=cacheGet().catch(()=>null);
 /* décompression : dans un Web Worker (sans figer la page) quand c'est possible, sinon sur la page */
 const WCODE='self.onmessage=async e=>{try{const r=await fetch("data:application/octet-stream;base64,"+e.data.b64);const t=await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text();self.postMessage({id:e.data.id,ok:JSON.parse(t)});}catch(x){self.postMessage({id:e.data.id,err:String(x)});}};';
 let WK=null,WN=0;const WP={};try{WK=new Worker(URL.createObjectURL(new Blob([WCODE],{type:"text/javascript"})));WK.onmessage=e=>{const p=WP[e.data.id];if(!p)return;delete WP[e.data.id];e.data.err?p.fallback():p.res(e.data.ok);};WK.onerror=()=>{WK=null;};}catch(e){WK=null;}
 const gunzipMain=async b64=>{let buf;try{buf=await (await fetch("data:application/octet-stream;base64,"+b64)).arrayBuffer();}catch(e){buf=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0));}const txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();return JSON.parse(txt);};
 const gunzip=b64=>{if(!WK)return gunzipMain(b64);return new Promise((res,rej)=>{const id=++WN;WP[id]={res,fallback:()=>gunzipMain(b64).then(res,rej)};WK.postMessage({id,b64});setTimeout(()=>{if(WP[id]){delete WP[id];gunzipMain(b64).then(res,rej);}},20000);});};
 const mergeTextes=(fiches,T)=>{if(!T)return;(fiches||[]).forEach(r=>{const t=T[r.id];if(!t)return;const o=r.data.objections||[];(t.objections||[]).forEach((x,i)=>{if(o[i])Object.assign(o[i],x);});const {objections,...reste}=t;Object.assign(r.data,reste);});};
 /* cache du navigateur : on garde les fichiers compressés (rapides à enregistrer), pas les données dépliées */
 let CACHE={};
 const petites=cols=>{const o={};["coaching_cards","roles","demandes","analyses"].forEach(n=>{if(cols&&cols[n])o[n]=cols[n];});return o;};
 const sauver=()=>cacheSet(Object.assign({v:2},CACHE));
 const BOOT=CACHED.then(async c=>{
  if(c&&c.v===2&&c.snap_gz&&!FRESH){CACHE=c;try{const d=await gunzip(c.snap_gz);if(!FRESH&&d.appels&&d.appels.length){apply({me:c.me,hebdo:c.hebdo,cols:Object.assign({},c.small,{appels:d.appels,fiches:d.fiches})});note("Mise à jour des données…");}}catch(e){}}
  let b=await call("bootstrap",CACHE.snap_gz&&CACHE.snap_at||null);
  if(b.inchange&&!DATA.fiches)b=await call("bootstrap",null);
  if(b.inchange&&DATA.fiches){b.cols.appels=DATA.appels;b.cols.fiches=DATA.fiches;}
  else if(b.snap_gz){const d=await gunzip(b.snap_gz);CACHE.snap_gz=b.snap_gz;CACHE.snap_at=b.snap_at;delete b.snap_gz;b.cols.appels=d.appels;b.cols.fiches=d.fiches;window.__textesOk=false;}
  else if(b.textes_inclus){window.__textesOk=true;CACHE.snap_gz=null;}
  FRESH=true;CACHE.me=b.me;CACHE.hebdo=b.hebdo;CACHE.small=petites(b.cols);apply(b);note("");sauver();
  if(window.__textesVoulus)window.__chargerTextes();
  return b;});
 /* textes des fiches (résumés, citations, exemples…) : chargés seulement quand un onglet en a besoin */
 let TX=null;
 window.__chargerTextes=()=>{window.__textesVoulus=true;if(window.__textesOk||!FRESH)return Promise.resolve();if(TX)return TX;
  note("Chargement des textes…");
  TX=(async()=>{try{let T=null;
   if(CACHE.textes_gz&&CACHE.textes_at===CACHE.snap_at)T=(await gunzip(CACHE.textes_gz)).textes;
   else{const t=await call("getTextes",null);if(t&&t.gz){T=(await gunzip(t.gz)).textes;CACHE.textes_gz=t.gz;CACHE.textes_at=t.at;sauver();}else if(t&&t.textes)T=t.textes;}

function coachData(name){const T=rowsP(),L=T.filter(r=>r.commercial===name);
 const st={n:L.length,g:winRate(L),eqg:winRate(T),lev:levRate(L),eqlev:levRate(T),ch:rate(L,r=>r.f.intention?.niveau==="chaud"),eqch:rate(T,r=>r.f.intention?.niveau==="chaud"),me:stepVals(L),eq:stepVals(T)};
 const pistes=coachGap(L,T).filter(x=>x.d<=-15).slice(0,3).map(x=>({titre:STEPS[x.k],texte:`Faite dans ${x.me} % de ses appels, contre ${x.eq} % pour l’équipe.`}));
 const fr=objStats(L).slice(0,3).map(x=>{const rs=respStats(L,x.c),fq=[...rs].sort((a,b)=>b.T-a.T)[0],bestEq=respStats(T,x.c).find(r=>r.T>=10&&r.p>(winRate(T)||0));return{frein:OBJ[x.c],n:x.n,rep:fq?REP[fq.rp]:"–",best:bestEq?REP[bestEq.rp]:null};});
 return{L,T,st,pistes,fr};}

 const ver=L.flatMap(r=>(r.f.verbatims||[]).filter(v=>v.locuteur==="commercial").map(v=>`- [${r.resultat}] ${v.citation}`)).slice(0,8).join("\n");
 const prompt=`Tu es un coach commercial expérimenté dans un cabinet d'expertise comptable. Rédige une analyse de coaching pour un commercial, en français, à partir de ces données.

Étapes de l'appel faites (lui / équipe) : ${Object.keys(STEPS).map(k=>`${STEPS[k]} ${st.me[k]} % / ${st.eq[k]} %`).join(" ; ")}.

${ex||"aucun"}

${ver||"aucune"}
Réponds uniquement en JSON : {"synthese":"2 phrases","forces":["…","…"],"axes":[{"titre":"…","constat":"1 phrase factuelle","conseil":"1 phrase","exercice":"1 exercice concret"}],"phrase":"une phrase type à essayer en appel"}. 2 à 3 axes maximum. Ton bienveillant et concret, sans jargon. Rédige synthese, forces, axes et phrase en t'adressant directement au commercial, au tutoiement (« Tu… »).`;
 try{const k=aiKey(name);S.ai[k]=await sample.json(prompt,{modelTier:"default"});S.aiN[k]=st.n;try{await db.collection("analyses").doc(slug(k)).set({cle:k,commercial:name,n:st.n,ia:S.ai[k],cree_le:new Date().toISOString()});}catch(e){}renderPanel();}

const fdate=x=>{const p=String(x||"").slice(0,10).split("-");return p.length===3&&p[0].length===4?`${p[2]}/${p[1]}/${p[0]}`:String(x||"");};
S.txOpen=false;S.coachPer="";S.coachCall=null;S.invites={};S.myEmail=null;
const needs=c=>!S.fiches[c.call_id]||S.fiches[c.call_id].version!==5;
const PTS={maitrise:100,acquisition:50,non_acquis:0};
function levelScore(R){const v=[];R.forEach(r=>{[...Object.keys(STEPS).map(k=>r.f.pitch?.[k]),...Object.keys(SOFT).map(k=>r.f.soft?.[k])].forEach(x=>{const p=PTS[lv(x)];if(p!==undefined)v.push(p);});});return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;}
function niveau(s){if(s===null)return{t:"Pas encore évalué",c:"neu"};if(s>=80)return{t:"Excellent niveau",c:"won"};if(s>=60)return{t:"Bon niveau, à consolider",c:"won"};if(s>=40)return{t:"En progression",c:"warn"};return{t:"À accompagner de près",c:"lost"};}
const softRate=(R,k)=>rate(R.filter(r=>lv(r.f.soft?.[k])!=="non_evalue"),r=>lv(r.f.soft?.[k])==="maitrise");
function myRole(){if(S.isOwner)return"admin";const r=S.roles[S.meId];return r?r.role:null;}
function myScope(){const r=S.roles[S.meId];return myRole()==="management"&&r?.perimetre?.length?r.perimetre:null;}
const emailKey=e=>String(e).trim().toLowerCase().replace("@","_at_");

function kpiCards(R){const W=won(R).length,L=lost(R).length,g=winRate(R),objs=R.flatMap(r=>r.f.objections||[]),lev=levRate(R),ch=rate(R,r=>r.f.intention?.niveau==="chaud"),sc=levelScore(R);
 const by={};R.forEach(r=>{const m=String(r.date_appel).slice(0,7);if(m)(by[m]??=[]).push(r);});const ms=Object.keys(by).sort().slice(-6);
 const bars=ms.map(m=>{const p=winRate(by[m])||0;return `<div title="${MOIS[+m.slice(5,7)-1]} : ${p} %"><i style="--h:${Math.max(4,p)}%"></i><span>${MOIS[+m.slice(5,7)-1]} · ${p} %</span></div>`;}).join("");
 const tx=S.res?`<div class="card kpi main s3"><div class="lbl">Taux de transformation ${i("taux")}</div><div class="val n">–</div><div class="ctx">Sans objet avec ce filtre</div></div>`
  :`<div class="card kpi main s3 clickable" data-tx tabindex="0" role="button" aria-expanded="${S.txOpen}"><div class="lbl">Taux de transformation ${i("taux")}</div><div class="val n">${ok(g)}</div><div class="ctx">${W} gagnés sur ${W+L} · <span class="more-l">${S.txOpen?"masquer le détail ▴":"voir le détail ▾"}</span></div>${S.txOpen&&ms.length?`<div class="months">${bars}</div>`:""}</div>`;
 return tx+`<div class="card kpi s3"><div class="lbl">Appels analysés ${i("analyses")}</div><div class="val n">${R.length}</div><div class="ctx">${new Set(R.map(r=>r.commercial)).size} commerciaux</div></div>
 <div class="card kpi s3"><div class="lbl">Freins levés ${i("levee")}</div><div class="val n">${ok(lev)}</div><div class="ctx">sur ${pl(objs.length,"frein soulevé","freins soulevés")}</div></div>
 <div class="card kpi s3"><div class="lbl">Prospects très intéressés ${i("chaud")}</div><div class="val n">${ok(ch)}</div><div class="ctx">intérêt jugé « chaud »</div></div>`;}

function coachSet(name){let T=rowsP();if(S.coachPer)T=T.filter(r=>String(r.date_appel).slice(0,7)===S.coachPer);let L=T.filter(r=>r.commercial===name);if(S.coachCall)L=L.filter(r=>r.call_id===S.coachCall);return{T:T.filter(r=>r.commercial!==name),L};}
function coachData(name){const {T,L}=coachSet(name);
 const st={n:L.length,g:winRate(L),eqg:winRate(T),lev:levRate(L),eqlev:levRate(T),ch:rate(L,r=>r.f.intention?.niveau==="chaud"),eqch:rate(T,r=>r.f.intention?.niveau==="chaud"),me:stepVals(L),eq:stepVals(T),score:levelScore(L),eqscore:levelScore(T),soft:Object.fromEntries(Object.keys(SOFT).map(k=>[k,softRate(L,k)])),eqsoft:Object.fromEntries(Object.keys(SOFT).map(k=>[k,softRate(T,k)]))};
 const pistes=coachGap(L,T).filter(x=>x.d<=-15).slice(0,3).map(x=>({titre:STEPS[x.k],texte:`Maîtrisée dans ${x.me} % de ses appels, contre ${x.eq} % pour l’équipe.`}));
 const fr=objStats(L).slice(0,3).map(x=>{const rs=respStats(L,x.c),fq=[...rs].sort((a,b)=>b.T-a.T)[0],bestEq=respStats(T,x.c).find(r=>r.T>=10&&r.p>(winRate(T)||0));return{frein:OBJ[x.c],n:x.n,rep:fq?REP[fq.rp]:"–",best:bestEq?REP[bestEq.rp]:null};});
 const fb=L.map(r=>r.f.feedback).filter(Boolean),ai=S.ai[aiKey(name)];
 const strong=Object.keys(STEPS).filter(k=>(st.me[k]||0)>=(st.eq[k]||0)+10&&(st.me[k]||0)>=50).map(k=>STEPS[k]);
 const trio={ok:ai?.forces?.join(" ")||fb.map(f=>f.bien_fonctionne).filter(Boolean).slice(0,2).join(" ")||(strong.length?`Points forts par rapport à l’équipe : ${strong.join(", ").toLowerCase()}.`:""),
  ko:ai?.axes?.map(a=>a.titre+" : "+a.constat).join(" ")||fb.map(f=>f.a_ameliorer).filter(Boolean).slice(0,2).join(" ")||pistes.map(p=>p.titre+" ("+p.texte.toLowerCase()+")").join(" "),
  plan:ai?.axes?.map(a=>a.exercice||a.conseil).filter(Boolean).join(" ")||fb.map(f=>f.plan_action).filter(Boolean).slice(0,2).join(" ")};

 g+=`<line x1="${X(ax)}" x2="${X(ax)}" y1="${Y(y0)}" y2="${Y(y1)}" stroke="var(--muted)" stroke-dasharray="4 4"/><line x1="${X(x0)}" x2="${X(x1)}" y1="${Y(ay)}" y2="${Y(ay)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;

 pts.forEach((q,i)=>{g+=`<g data-coach="${esc(q.c)}" style="cursor:pointer" data-tiptext="${esc(q.c)} · ${q.n} appels · ${q.y} % de deals gagnés · étapes ${q.x} %"><circle cx="${X(q.x)}" cy="${Y(q.y)}" r="12" fill="${col(q)}" stroke="var(--card)" stroke-width="2"/><text x="${X(q.x)}" y="${Y(q.y)}" text-anchor="middle" dominant-baseline="central" style="fill:#fff;font-weight:700;font-size:11px;pointer-events:none">${i+1}</text></g>`;});
 return `<svg class="chartsvg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Matrice méthode et transformation par commercial">${g}</svg><div class="mlegend">${pts.map((q,i)=>`<span data-coach="${esc(q.c)}"><i style="background:${col(q)}">${i+1}</i>${esc(q.c)} <small class="lowtxt">${q.y} % · ${q.x} %</small></span>`).join("")}</div>`;}

/* chiffres sur les barres, précédés de la lettre de la légende (L, A, D) */
function etiquettes(cx,v,leads,y,gw){if(gw<40)return "";const base=y(0),ink="var(--ink)",T=(x,yy,t,c)=>`<text x="${x}" y="${yy}" text-anchor="middle" style="font-size:10px;font-weight:500;fill:${c}">${t}</text>`,out=[],dessus=[];
 const tD=v.g?y(v.g):base,tA=v.a?y(v.a):base,tL=leads&&v.l?y(v.l):base;let lIn=false;
 if(v.g){if(base-tD>=14)out.push(T(cx,tD+11,"D "+v.g,"var(--bar-won-txt)"));else dessus.push("D "+v.g);}
 if(v.a){const bas=v.g?Math.min(tD,base):base;if(bas-tA>=14)out.push(T(cx,tA+11,"A "+v.a,"var(--bar-call-txt)"));else dessus.push("A "+v.a);}
 if(leads&&v.l){const bas=Math.min(v.a?tA:base,v.g?tD:base);if(bas-tL>=26+11*dessus.length){out.push(T(cx,tL+11,"L "+v.l,ink));lIn=true;}else dessus.push("L "+v.l);}
 /* les chiffres des barres trop basses se posent juste au-dessus d'elles, dans la colonne */
 let yy=Math.min(v.g?tD:base,v.a?tA:base)-4;dessus.forEach(t=>{if(t[0]==="L")yy=Math.min(yy,tL-4);out.push(T(cx,yy,t,ink));yy-=11;});return out.join("");}

 const T={a:0,l:0,g:0};V.forEach(v=>{T.a+=v.a;T.l+=v.l||0;T.g+=v.g;});const mx=Math.max(1,...V.flatMap(v=>[v.a,v.l||0,v.g]));
 const S=[...(leads?[["l","var(--bar-lead-solid)","leads affectés"]]:[]),["a","var(--bar-call)","appels analysés"],["g","var(--bar-won)","deals gagnés"]];
 const W=1100,Hh=300,p={l:56,r:60,t:18,b:30},n=ks.length,gw=(W-p.l-p.r)/Math.max(1,n-1),ih=Hh-p.t-p.b,X=i=>n===1?p.l+(W-p.l-p.r)/2:p.l+i*gw,Y=v=>Hh-p.b-ih*Math.sqrt(Math.max(0,v))/Math.sqrt(mx);let s="";

 const ticks=[...new Set([0,...[1,2,3].map(k=>nice(mx*k*k/16)).filter(t=>t>=1&&Number.isInteger(t)&&t<mx*0.8),mx])];
 ticks.forEach(t=>{const yy=Y(t);s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}" stroke="var(--line2)"/><text x="${p.l-6}" y="${yy}" text-anchor="end" dominant-baseline="middle">${t.toLocaleString("fr-FR")}</text>`;});

 const showAll=n<=8,occ={};

  pts.forEach(([x,yy],i)=>{s+=`<circle cx="${x}" cy="${yy}" r="${i===n-1?4.5:3.2}" fill="${c}" stroke="var(--card)" stroke-width="1.5"/>`;const ly=yy-8,pris=(occ[i]=occ[i]||[]);if(showAll&&i<n-1&&V[i][key]&&i>0&&!pris.some(o=>Math.abs(o-ly)<12)){pris.push(ly);s+=`<text x="${x}" y="${ly}" text-anchor="middle" style="font-size:11px;font-weight:500;fill:var(--muted)">${V[i][key]}</text>`;}});
  const last=V[n-1][key]||0;s+=`<text x="${X(n-1)+9}" y="${Y(last)}" dominant-baseline="middle" style="font-size:12px;font-weight:600;fill:var(--ink)">${last}</text>`;});
 ks.forEach((k,i)=>{const x0=n===1?p.l:X(i)-gw/2,w=n===1?W-p.l-p.r:gw;s+=`<rect x="${Math.max(p.l-6,x0)}" y="${p.t}" width="${w}" height="${ih}" fill="transparent" data-tiptext="Semaine du ${fdate(k)}${leads?` · ${V[i].l} leads affectés`:""} · ${V[i].a} appels analysés · ${V[i].g} deals gagnés"></rect>`;});

 const conv=leads&&T.l?` · sur la période, <b>${Math.round(100*T.g/T.l)} deals gagnés pour 100 leads affectés</b>`:"";

/* argumentaire : exemples réels intégrés à chaque frein (phrase du prospect → réponse qui l'a levé) */
function exemplesFrein(R,c){return R.flatMap(r=>(r.f.objections||[]).filter(o=>o.categorie===c&&o.reaction==="levee"&&o.verbatim_prospect&&o.reponse_commercial).map(o=>({o,r}))).sort((a,b)=>(b.r.resultat==="Gagné")-(a.r.resultat==="Gagné")||String(b.r.date_appel).localeCompare(String(a.r.date_appel)));}
function addExemples(){if(S.tab!=="freins")return;const R=rows(true);document.querySelectorAll("#view tr[data-frein]").forEach(tr=>{if(tr.dataset.ex)return;tr.dataset.ex="1";const n=exemplesFrein(R,tr.dataset.frein).length;if(!n)return;
 tr.cells[0].insertAdjacentHTML("beforeend",`<button class="link" data-exfrein="${tr.dataset.frein}" aria-expanded="false" style="font-size:12px;margin-top:4px">Exemples (${n}) ▾</button>`);});}
const _renderEx=render;render=function(){_renderEx();addExemples();};

 if(open){if(nx&&nx.classList.contains("exrow"))nx.remove();b.setAttribute("aria-expanded","false");b.textContent=b.textContent.replace("▴","▾");return;}
 const L=exemplesFrein(rows(true),b.dataset.exfrein).slice(0,4),cols=tr.cells.length;

 tr.nextElementSibling.querySelectorAll("p[data-repcall]").forEach(p=>{if(!p.querySelector(".lowtxt"))return;phraseCommerciale(p.dataset.repcall,p.dataset.pv).then(q=>{p.innerHTML=q?`« ${esc(q)} »`:`${esc(p.dataset.resume)} <span class="lowtxt">(résumé)</span>`;if(q)polir(p.dataset.repcall,q).then(r=>{if(r)p.innerHTML=`« ${esc(r)} »`;});});});
 b.setAttribute("aria-expanded","true");b.textContent=b.textContent.replace("▾","▴");});

/* phrase réellement dite par le commercial juste après le frein, retrouvée dans la transcription */
async function transcriptionDe(id){const c=S.calls[id]||{};if(c.transcription)return c.transcription;
 if(window.google&&google.script&&google.script.run)return new Promise(res=>google.script.run.withSuccessHandler(t=>{if(S.calls[id])S.calls[id].transcription=t;res(t||"");}).withFailureHandler(()=>res("")).getTranscript(id));return "";}
async function phraseCommerciale(id,pv){const t=await transcriptionDe(id);if(!t)return "";const L=String(t).split(/\n/).map(l=>{const m=l.match(/^\s*(?:\[[^\]]*\]\s*)?(Commercial|Prospect)\s*:\s*(.*)$/i);return m?{qui:m[1].toLowerCase(),txt:m[2]}:null;}).filter(Boolean);
 const mots=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").match(/[a-z0-9]{3,}/g)||[],cible=new Set(mots(pv));if(!cible.size)return "";
 let best=-1,score=0;L.forEach((l,i)=>{if(l.qui!=="prospect")return;const m=mots(l.txt),sc=m.filter(w=>cible.has(w)).length/cible.size;if(sc>score){score=sc;best=i;}});if(best<0||score<.4)return "";
 const out=[];let nb=0;for(let i=best+1;i<L.length&&out.length<5;i++){if(L[i].qui==="commercial"){const n=L[i].txt.split(/\s+/).length;if(!nb&&n<4&&/^(oui|ouais|d.accord|ok|tr[eè]s bien|hum+|euh+|ah|avec|alors)[ ,.!]*$/i.test(L[i].txt.trim()))continue;out.push(L[i].txt);nb+=n;}else if(nb>=15&&mots(L[i].txt).length>3)break;}
 if(nb<6)return "";
 return arrondir(out.join(" "));}

/* Verbatims : deux blocs bien distincts — ce que disent les prospects (par thème) / les formulations des commerciaux qui signent */

 const q=[];R.forEach(r=>(r.f.verbatims||[]).forEach(v=>q.push({...v,r})));
 const th={objection:"Freins",irritant:"Irritants",besoin:"Besoins"},lim=S.vmore?20:6;
 const pro=q.filter(x=>x.locuteur==="prospect"&&x.categorie===S.vtheme),com=q.filter(x=>x.locuteur==="commercial"&&x.r.resultat==="Gagné"&&(x.categorie==="argument"||x.categorie==="bonne_pratique"));
 const itP=x=>`<div class="vq ${x.r.resultat==="Gagné"?"won":"lost"}"><div><p>« ${esc(x.citation)} »</p><small>Prospect · ${x.r.resultat==="Gagné"?"deal gagné":x.r.resultat==="Perdu"?"deal perdu":"deal en cours"}</small></div></div>`;
 const itC=x=>`<div class="vq won"><div><p>« ${esc(x.citation)} »</p><small>${esc(x.r.commercial)} · deal gagné</small></div></div>`;
 const more=n=>n>6?`<button class="more" data-more>${S.vmore?"Afficher moins":"Voir plus"}</button>`:"";
 return `<div class="card s6 vcard"><div class="ch"><div><h2>Ce que disent les prospects ${i("vqp")}</h2><p>Leurs mots exacts, par thème.</p></div></div>
 <div class="vtabs" style="margin:0 0 10px">${Object.entries(th).map(([k,l])=>`<button data-vt="${k}" aria-pressed="${S.vtheme===k}">${l}</button>`).join("")}</div>
 ${pro.slice(0,lim).map(itP).join("")||"<p class='lowtxt'>Aucune citation sur ce thème.</p>"}${more(pro.length)}</div>
 <div class="card s6 vcard vcard-won"><div class="ch"><div><h2>Les formulations qui font signer ${i("vqc")}</h2><p>Phrases de commerciaux relevées dans des appels gagnés.</p></div><div class="side">${pl(com.length,"phrase")}</div></div>
 ${com.slice(0,lim).map(itC).join("")||"<p class='lowtxt'>Aucune phrase d’appel gagné sur la période.</p>"}${more(com.length)}</div>`;}

/* phrases du commercial retrouvées dans la transcription : tics de langage retirés, coupe en fin de phrase */

 s=s.replace(/\b(euh+|heu+|hum+|hm+|ben|bah|bon ben|du coup|en fait|si vous voulez|voilà|quoi|genre|tu vois|vous voyez)\b[ ,.]*/gi," ");
 s=s.replace(/\bouais\b/gi,"oui").replace(/\b(\w+)([ ,]+\1\b)+/gi,"$1").replace(/\b((?:\w+\W+){1,4}?)\1/gi,"$1");
 s=s.replace(/\s+([,.!?;:])/g,"$1").replace(/([,.!?;:])(?=\S)/g,"$1 ").replace(/,\s*,/g,",").replace(/^[\s,.;:]+/,"").replace(/\s{2,}/g," ").trim();
 const ph=s.match(/[^.!?]+[.!?]+/g)||[s];let out="";for(const p of ph){if((out+p).split(/\s+/).length>40&&out)break;out+=p;}out=out.trim()||s;
 if(out.split(/\s+/).length>40)out=out.split(/\s+/).slice(0,40).join(" ").replace(/[,;:]$/,"")+"…";
 out=out.charAt(0).toUpperCase()+out.slice(1);if(!/[.!?…]$/.test(out))out+=".";return out;}

/* « arrondir » une phrase de transcription : tics de langage, répétitions et phrase coupée en fin de citation */
function arrondir(t){let q=" "+String(t||"")+" ";
 q=q.replace(/[\s,]+(euh+|heu+|hum+|hein|bah|ben|bon ben|du coup|en fait|voilà|enfin bref)(?=[\s,.!?])/gi," ");
 q=q.replace(/\bouais\b/gi,"oui").replace(/\b(oui|non|d'accord|ok)([,\s]+\1\b)+/gi,"$1");
 for(let k=0;k<3;k++)q=q.replace(/\b((?:[\wÀ-ÿ']+\s){0,3}[\wÀ-ÿ']+)[,\s]+\1\b/gi,"$1");
 q=q.replace(/\s+([,.!?])/g,"$1").replace(/([,.!?]){2,}/g,"$1").replace(/,\s*,/g,",").replace(/\s{2,}/g," ").trim().replace(/^[,.\s]+/,"");
 const w=q.split(" ");if(w.length>45){q=w.slice(0,45).join(" ");const p=Math.max(q.lastIndexOf(". "),q.lastIndexOf("? "),q.lastIndexOf("! "));q=p>40?q.slice(0,p+1):q+"…";}
 else if(!/[.!?…]$/.test(q)){const p=Math.max(q.lastIndexOf(". "),q.lastIndexOf("? "),q.lastIndexOf("! "));q=p>30?q.slice(0,p+1):q+".";}
 return q.charAt(0).toUpperCase()+q.slice(1);}

<script>
/* ===== Retours du 4 novembre (Mélanie, Edouard) ===== */
/* 1. Colonne « Piste de coaching » renommée : elle indique l'étape de l'appel la plus en retrait par rapport à l'équipe */
(function(){
 const _tr=teamRows;teamRows=function(R){return _tr(R).map(x=>{if(typeof x.coach==="string"&&x.coach.includes("Dans la moyenne"))x.coach='<span class="tag neu">Aucun écart marqué</span>';return x;});};
 const _tt=teamTable;teamTable=function(R,span,compact){return _tt(R,span,compact).replace("<th>Piste de coaching</th>","<th>Étape la plus en retrait</th>");};
 TIPS.team="Nombre d’appels analysés et taux de transformation de chaque commercial sur la période. « Étape la plus en retrait » : l’étape de l’appel (découverte, prix, objections…) où il est le plus en dessous de l’équipe, quand l’écart dépasse 15 points. « Aucun écart marqué » ne parle ni du volume d’appels ni du taux de transformation : sa façon de mener l’appel est proche de celle de l’équipe. Cliquez sur une ligne pour ouvrir son profil.";
})();
/* 2. Glossaire des définitions */
(function(){
 const G=[["Deal gagné (libellé proposé : « signé »)","L’opportunité Salesforce liée à l’appel est « Fermée gagnée » : la lettre de mission est signée. C’est la même définition que dans les autres rapports Salesforce."],
  ["Deal perdu","L’opportunité est « Fermée perdue », ou le lead est « Non converti » ou « Non qualifié »."],
  ["Deal en cours","L’opportunité est encore ouverte, par exemple « Proposition - LDM » (lettre de mission envoyée, pas encore signée), ou le lead est encore en cours de traitement."],
  ["Taux de transformation","Deals gagnés ÷ (deals gagnés + deals perdus), sur les appels de la période. Les deals en cours et les résultats inconnus ne comptent pas."],
  ["Appel analysé","Un appel de plus de 90 secondes, passé depuis le 1er juin sur une ligne sales, dont la transcription a été analysée selon la grille."],
  ["Appels analysés sur appels passés","Combien de ses appels de plus de 90 secondes (d’après Salesforce) ont pu être analysés, c’est-à-dire avaient un enregistrement et une transcription Aircall. Sous 80 %, ses chiffres reposent sur une partie de ses appels seulement."],
  ["Frein levé","Après la réponse du commercial, le prospect ne revient pas sur son frein et l’échange avance. « Partiellement » : il hésite encore. « Maintenu » : il reste sur sa position."],
  ["Sans réponse","Le commercial ne répond pas au frein : il change de sujet, abandonne ou clôt l’échange."],
  ["Étape à travailler en priorité","L’étape de l’appel que le commercial maîtrise le moins bien par rapport à l’équipe, quand l’écart dépasse 15 points. « Rien de prioritaire » : sa méthode est proche de celle de l’équipe. Ce n’est ni un classement ni un jugement sur son volume ou ses résultats."],
  ["Niveau de méthode","Part des étapes maîtrisées dans ses appels, sur 100 : Excellent (80 et plus), Bon niveau (60 à 79), En progression (40 à 59), À accompagner (moins de 40)."],
  ["Appel parfait","Un appel où au moins 85 % des étapes évaluées sont maîtrisées, sans aucune étape non acquise (au moins 3 étapes évaluées)."]];
 const st=document.createElement("style");st.textContent='.gloss{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;background:rgba(7,6,43,.45)}.gloss.on{display:flex}.gloss>div{background:var(--card);color:var(--ink);border-radius:16px;max-width:720px;width:100%;max-height:84vh;overflow:auto;padding:24px 26px;box-shadow:0 20px 50px rgba(7,6,43,.3)}.gloss dt{font-weight:700;margin-top:14px}.gloss dd{margin:4px 0 0;color:var(--muted);line-height:1.5}.gloss h2{margin:0 0 4px}';document.head.appendChild(st);
 const box=document.createElement("div");box.className="gloss";box.setAttribute("role","dialog");box.setAttribute("aria-label","Définitions");
 box.innerHTML=`<div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>Définitions</h2><button class="btn ghost" data-glossclose aria-label="Fermer">✕</button></div><p class="lowtxt" style="margin:0 0 6px">Ce que veulent dire les indicateurs du tableau de bord.</p><dl>${G.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl></div>`;
 document.body.appendChild(box);

 add();setTimeout(add,500);
 document.addEventListener("click",e=>{if(e.target.closest("#glossBtn")){box.classList.add("on");return;}if(e.target.closest("[data-glossclose]")||e.target===box)box.classList.remove("on");});

/* 3. Lecture inversée : pourquoi les appels n'aboutissent pas */
function sansSignatureCard(R){const fin=R.filter(r=>r.resultat==="Gagné"||r.resultat==="Perdu"),P=fin.filter(r=>r.resultat==="Perdu"),W=fin.filter(r=>r.resultat==="Gagné");if(fin.length<5)return "";
 const cats=Object.keys(OBJ).map(c=>({c,p:pct(P.filter(r=>hasObj(r,c)).length,P.length),w:pct(W.filter(r=>hasObj(r,c)).length,W.length),n:P.filter(r=>hasObj(r,c)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,6);
 const sans=P.filter(r=>!(r.f.objections||[]).length).length;
 return `<div class="card s12" id="nosign"><div class="ch"><div><h2>Pourquoi les appels n’aboutissent pas ${i("nosign")}</h2><p>Sur <b>${fin.length}</b> appels dont le résultat est connu, <b>${P.length}</b> n’ont pas abouti (${pct(P.length,fin.length)} %). Voici les freins exprimés dans ces appels.</p></div></div>
 <div class="tw"><table><thead><tr><th>Frein</th><th>Appels non aboutis où il apparaît</th><th>Dans les appels gagnés</th></tr></thead><tbody>${cats.map(x=>`<tr><td><b>${OBJ[x.c]}</b></td><td><div class="mini"><div class="bar"><i style="--w:${x.p||0}%;background:var(--lost)"></i></div><b class="n">${x.p} %</b></div><span class="lowtxt"> ${pl(x.n,"appel")}</span></td><td class="n">${x.w??"–"} %</td></tr>`).join("")}
 <tr><td><b>Aucun frein exprimé</b></td><td><div class="mini"><div class="bar"><i style="--w:${pct(sans,P.length)||0}%;background:var(--muted)"></i></div><b class="n">${pct(sans,P.length)} %</b></div><span class="lowtxt"> ${pl(sans,"appel")}</span></td><td class="n">–</td></tr></tbody></table></div>
 <p class="lowtxt" style="margin:10px 0 0">Un même appel peut contenir plusieurs freins. Quand un frein est bien plus fréquent dans les appels non aboutis que dans les gagnés, c’est lui qui fait perdre.</p></div>`;}
TIPS.nosign="On part des appels dont le résultat Salesforce est connu (gagnés ou perdus) et on regarde, parmi ceux qui n’ont pas abouti, la part où chaque frein a été exprimé par le prospect. La dernière colonne donne la même part dans les appels gagnés, pour comparer.";
/* 4. Par famille de frein : qui le gère le mieux (et aisance face aux freins) */
S.ofam=S.ofam||"";
function famRows(R,c){const by={};R.forEach(r=>(r.f.objections||[]).filter(o=>!c||o.categorie===c).forEach(o=>{const x=by[r.commercial]=by[r.commercial]||{c:r.commercial,n:0,lev:0,part:0,sans:0,calls:new Set()};x.n++;if(o.reaction==="levee")x.lev++;else if(o.reaction==="partielle")x.part++;if(o.type_reponse==="pas_de_reponse")x.sans++;x.calls.add(r);}));
 return Object.values(by).filter(x=>x.n>=3).map(x=>({...x,pl:pct(x.lev,x.n),pp:pct(x.part,x.n),ps:pct(x.sans,x.n),win:winRate([...x.calls])})).sort((a,b)=>(b.pl??-1)-(a.pl??-1)||b.n-a.n);}
function famCard(R){const counts=Object.keys(OBJ).map(c=>({c,n:R.reduce((s,r)=>s+(r.f.objections||[]).filter(o=>o.categorie===c).length,0)})).filter(x=>x.n).sort((a,b)=>b.n-a.n);if(!counts.length)return "";
 if(S.ofam&&!counts.some(x=>x.c===S.ofam))S.ofam="";const c=S.ofam,L=famRows(R,c),best=L[0],eq=famRows(R.map(r=>({...r,commercial:"Équipe"})),c)[0];
 const b=(v,col)=>`<div class="mini"><div class="bar"><i style="--w:${v||0}%;${col?`background:${col}`:""}"></i></div><b class="n">${v??"–"} %</b></div>`;
 return `<div class="card s12" id="famcard"><div class="ch"><div><h2>${c?`Qui gère le mieux « ${OBJ[c].toLowerCase()} »`:"Aisance face aux freins"} ${i("fam")}</h2><p>${c?"Pour ce frein : combien de fois chaque commercial l’a rencontré, et ce qu’il en a fait. Les exemples de réponses réelles sont dans l’argumentaire ci-dessus (« Exemples »).":"Tous freins confondus : qui lève les freins, et qui les laisse sans réponse (change de sujet, abandonne, clôt l’échange)."}</p></div></div>
 <div class="vtabs" style="flex-wrap:wrap;margin:0 0 12px"><button data-ofam="" aria-pressed="${!c}">Tous les freins</button>${counts.slice(0,9).map(x=>`<button data-ofam="${x.c}" aria-pressed="${c===x.c}">${OBJ[x.c]} (${x.n})</button>`).join("")}</div>
 ${L.length?`<div class="tw"><table><thead><tr><th>Commercial</th><th>Freins rencontrés</th><th>Levés</th><th>Partiellement levés</th><th>Sans réponse</th><th>Taux de transformation de ces appels</th></tr></thead><tbody>
 ${L.map(x=>`<tr class="click" data-coach="${esc(x.c)}" tabindex="0"><td><b>${esc(x.c)}</b>${x===best&&L.length>1?' <span class="tag won">Le plus efficace</span>':""}</td><td class="n">${x.n}</td><td>${b(x.pl,"var(--pos)")}</td><td>${b(x.pp,"#B7791F")}</td><td>${b(x.ps,"var(--lost)")}</td><td>${b(x.win)}</td></tr>`).join("")}
 ${eq?`<tr style="border-top:2px solid var(--line)"><td><b>Équipe</b></td><td class="n">${eq.n}</td><td>${b(eq.pl,"var(--pos)")}</td><td>${b(eq.pp,"#B7791F")}</td><td>${b(eq.ps,"var(--lost)")}</td><td>${b(eq.win)}</td></tr>`:""}</tbody></table></div>`:`<p class="lowtxt">Pas assez de cas sur la période (au moins 3 par commercial).</p>`}</div>`;}
TIPS.fam="Pour chaque commercial ayant rencontré au moins 3 fois le frein sur la période : la part de ces freins levés (le prospect avance), partiellement levés (il hésite encore) et laissés sans réponse (le commercial ne répond pas, change de sujet ou clôt l’échange). La dernière colonne donne le taux de transformation des appels où ce frein est apparu. Cliquez sur un commercial pour ouvrir son profil.";
document.addEventListener("click",e=>{const b=e.target.closest("[data-ofam]");if(!b)return;S.ofam=b.dataset.ofam;render();const c=document.getElementById("famcard");if(c&&c.scrollIntoView)c.scrollIntoView({block:"nearest"});});
(function(){const _r=render;render=function(){_r();if(window.__batch)return;const v=document.getElementById("view");if(!v)return;let R;try{R=rows();}catch(e){return;}
 if(S.tab==="freins"&&!document.getElementById("famcard")){const h=famCard(R);if(h)v.insertAdjacentHTML("beforeend",h);}
 if(S.tab==="synthese"&&!document.getElementById("nosign")){const h=sansSignatureCard(R);if(h){const first=v.firstElementChild;if(first&&first.nextElementSibling)first.insertAdjacentHTML("afterend",h);else v.insertAdjacentHTML("beforeend",h);}}};})();

<script>
/* ===== Retours du 4 novembre, suite ===== */
/* Tableau « Performance par commercial » : colonne de coaching explicite, aide sur chaque colonne */
teamRows=function(R){const T=rows(true),coms=[...new Set(R.map(r=>r.commercial))];
 return coms.map(c=>{const L=T.filter(r=>r.commercial===c),g=winRate(L),gp=coachGap(L,T)[0];
  const coach=L.length<3?'<span class="tag neu">Trop peu d’appels</span>':gp&&gp.d<=-15?`<span class="tag warn">${STEPS[gp.k]}</span><div class="lowtxt" style="margin-top:3px">maîtrisée dans ${gp.me} % de ses appels, contre ${gp.eq} % pour l’équipe</div>`:'<span class="tag won">Rien de prioritaire</span><div class="lowtxt" style="margin-top:3px">sa méthode est proche de celle de l’équipe</div>';
  return{c,n:L.length,g,coach};}).sort((a,b)=>(b.g??-1)-(a.g??-1)||b.n-a.n);};
(function(){const _t=teamTable;teamTable=function(R,span,compact){return _t(R,span,compact)
 .replace("<th>Commercial</th>",`<th>Commercial ${i("col_com")}</th>`).replace("<th>Appels</th>",`<th>Appels analysés ${i("col_appels")}</th>`)
 .replace("<th>Taux de transformation</th>",`<th>Taux de transformation ${i("col_tx")}</th>`).replace("<th>Étape la plus en retrait</th>",`<th>Étape à travailler en priorité ${i("col_focus")}</th>`);};})();
TIPS.col_com="Le commercial, tel qu’il apparaît dans le nom de sa ligne Aircall. Cliquez sur une ligne pour ouvrir son profil.";
TIPS.col_appels="Nombre de ses appels analysés sur la période choisie : appels de plus de 90 secondes, avec un enregistrement et une transcription Aircall.";
TIPS.col_tx="Deals gagnés ÷ (deals gagnés + deals perdus), sur ses appels analysés de la période. Un deal est gagné quand l’opportunité Salesforce est « Fermée gagnée ». Les deals en cours ne comptent pas.";
TIPS.col_focus="L’étape de l’appel qu’il maîtrise le moins bien par rapport à l’équipe, avec les deux pourcentages pour comparer. Elle n’apparaît que si l’écart dépasse 15 points ; sinon, « Rien de prioritaire ». Ce n’est ni un classement ni un jugement sur son volume d’appels ou ses résultats : c’est le premier sujet à aborder en coaching.";
/* Couverture : appels analysés sur appels passés, en clair */
addCouverture=function(){if(S.tab!=="equipe")return;const t=[...document.querySelectorAll("#view table")].find(x=>x.querySelector("tr[data-coach]"));if(!t||t.dataset.cov)return;t.dataset.cov="1";
 const hr=t.querySelector("thead tr");if(hr)hr.insertAdjacentHTML("beforeend",`<th>Appels analysés sur appels passés ${i("couverture")}</th>`);
 t.querySelectorAll("tr[data-coach]").forEach(tr=>{const c=couverture(tr.dataset.coach);tr.insertAdjacentHTML("beforeend",`<td>${c?`<b>${c.n}</b> sur ${c.tot} <span class="tag ${c.p<80?"warn":"won"}">${c.p} %</span>${c.p<80?'<div class="lowtxt" style="margin-top:3px">chiffres à prendre avec prudence</div>':""}`:"<span class='lowtxt'>–</span>"}</td>`);});};
TIPS.couverture="Combien de ses appels ont pu être analysés, sur tous ceux qu’il a passés : appels de ses lignes sales, décrochés, de plus de 90 secondes, d’après Salesforce, sur la période. Un appel n’est pas analysé quand Aircall n’a pas d’enregistrement ou de transcription. Sous 80 %, ses chiffres reposent sur une partie de ses appels seulement.";
/* Appels parfaits : définition assouplie */
parfait=function(r){const ev=Object.keys(STEPS).map(k=>lv(r.f.pitch?.[k])).filter(x=>x in PTS);if(ev.length<3)return false;if(ev.some(x=>x==="non_acquis"))return false;return ev.filter(x=>x==="maitrise").length/ev.length>=0.85;};
TIPS.parfaits="Un appel est « parfait » quand au moins 85 % des étapes évaluées sont maîtrisées et qu’aucune n’est non acquise (au moins trois étapes évaluées). Le taux de transformation compare les appels parfaits aux autres, sur les appels dont le résultat est connu.";
/* Activité par semaine : période écrite en toutes lettres */
(function(){const _w=weeklySvg;const fd=d=>{const p=String(d).slice(0,10).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;};
 weeklySvg=function(R,names){let h=_w(R,names);let a,b;try{[a,b]=range();}catch(e){}const ds=R.map(r=>String(r.date_appel||"").slice(0,10)).filter(Boolean).sort();
  a=a||ds[0];b=b||new Date().toISOString().slice(0,10);return a?h.replace("sur la période,",`du ${fd(a)} au ${fd(b)},`):h;};})();
/* Fiche coaching : les zones de texte gardent leur taille et leur contenu, et s'agrandissent avec le texte */
S.taH=S.taH||{};S.taV=S.taV||{};
(function(){const st=document.createElement("style");st.textContent='.trio textarea{resize:vertical;overflow:hidden}';document.head.appendChild(st);
 const grow=t=>{t.style.height="auto";t.style.height=Math.max(110,t.scrollHeight+4,S.taH[(S.coach||"")+t.id]||0)+"px";};
 const fix=()=>{document.querySelectorAll(".trio textarea").forEach(t=>{const k=(S.coach||"")+t.id;if(S.taV[k]!==undefined&&t.value!==S.taV[k])t.value=S.taV[k];grow(t);
  if(!t.dataset.ro&&window.ResizeObserver){t.dataset.ro="1";let first=true;new ResizeObserver(()=>{if(first){first=false;return;}if(t.style.height)S.taH[k]=parseInt(t.style.height)||t.offsetHeight;}).observe(t);}
  t.addEventListener("mouseup",()=>{S.taH[k]=t.offsetHeight;});});};
 const _rp=renderPanel;renderPanel=function(){_rp();fix();};
 document.addEventListener("input",e=>{if(e.target.matches&&e.target.matches(".trio textarea")){S.taV[(S.coach||"")+e.target.id]=e.target.value;grow(e.target);}});})();
