/* Connexion Google et liaison avec le serveur (page hébergée sur GitHub). */
(function(){
 const CLIENT_ID="115983769399-mk3pgclco86g5r9nruou7vj5ku7u3nvm.apps.googleusercontent.com",API=window.IC_API_URL,PAGE=window.IC_PAGE;
 const K="ic_jeton",DOM=["kerogo.com","keobiz.fr"];
 const lire=t=>{try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));}catch(e){return null;}};
 let JETON=null;try{JETON=localStorage.getItem(K);}catch(e){}
 const valide=t=>{const p=t&&lire(t);return p&&p.exp*1000-Date.now()>60000?p:null;};
 if(!valide(JETON))JETON=null;

 /* écran de connexion */
 const css=document.createElement("style");css.textContent='#icLogin{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:#F3F3F8;font-family:"Instrument Sans",Arial,sans-serif;padding:20px}#icLogin.on{display:flex}#icLogin .b{background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(7,6,43,.14);padding:34px 36px;max-width:440px;width:100%;text-align:center;color:#07062B}#icLogin h1{font-size:22px;margin:0 0 8px}#icLogin p{color:#5B5A7A;margin:0 0 20px;line-height:1.5}#icLogin .gb{display:flex;justify-content:center;min-height:44px}#icLogin .err{color:#D64A35;margin:14px 0 0;font-size:14px}@media (prefers-color-scheme:dark){#icLogin{background:#07062B}#icLogin .b{background:#1C1A66;color:#fff}#icLogin p{color:#C9C8E8}}#icOut{position:fixed;left:14px;bottom:12px;z-index:50;font:12px Arial,sans-serif;color:#5B5A7A;background:none;border:0;cursor:pointer;text-decoration:underline}';
 document.head.appendChild(css);
 const ecran=()=>{let d=document.getElementById("icLogin");if(!d){d=document.createElement("div");d.id="icLogin";d.innerHTML='<div class="b"><h1>'+(PAGE==="coaching"?"Mon coaching":"Performance des appels sales")+'</h1><p>Connectez-vous avec votre compte Google <b>@kerogo.com</b> ou <b>@keobiz.fr</b>.</p><div class="gb" id="icGBtn"></div><p class="err" id="icErr"></p></div>';(document.body||document.documentElement).appendChild(d);}return d;};
 let attente=null,resoudre=null;
 const gisPret=()=>new Promise(r=>{const t=()=>window.google&&google.accounts&&google.accounts.id?r():setTimeout(t,100);t();});
 let gisInit=false;
 const initGis=async()=>{await gisPret();if(gisInit)return;gisInit=true;google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,cancel_on_tap_outside:false,callback:rep=>{const p=lire(rep.credential);
   if(!p||DOM.indexOf(String(p.email||"").split("@")[1])===-1){document.getElementById("icErr").textContent="Ce compte n’est pas autorisé : utilisez une adresse @kerogo.com ou @keobiz.fr.";return;}
   JETON=rep.credential;try{localStorage.setItem(K,JETON);}catch(e){}const neuf=String(p.email).toLowerCase();const change=window.__UID&&window.__UID!==neuf;window.__UID=neuf;ecran().classList.remove("on");
   if(change){location.reload();return;}if(resoudre){resoudre(JETON);resoudre=null;attente=null;}}});};
 const connexion=()=>{if(attente)return attente;attente=new Promise(r=>{resoudre=r;});(async()=>{const d=ecran();d.classList.add("on");await initGis();
   google.accounts.id.renderButton(document.getElementById("icGBtn"),{theme:"outline",size:"large",text:"signin_with",shape:"pill",locale:"fr"});google.accounts.id.prompt();})();return attente;};
 const jeton=async()=>valide(JETON)?JETON:connexion();
 window.icDeconnexion=()=>{try{localStorage.removeItem(K);}catch(e){}JETON=null;try{google.accounts.id.disableAutoSelect();}catch(e){}location.reload();};
 /* appel du serveur */
 let PREF=null;
 async function api(fn,args,essai){
  if(PREF&&PREF.fn===fn&&!essai&&(fn==="getData"||args[0]==null)){const p=PREF.p;PREF=null;return p;}

  try{r=await (await fetch(API,{method:"POST",body:JSON.stringify({t,fn,args}),headers:{"Content-Type":"text/plain;charset=utf-8"}})).json();}catch(e){throw new Error("Serveur injoignable");}
  if(r.err==="auth"&&!essai){JETON=null;try{localStorage.removeItem(K);}catch(e){}return api(fn,args,1);}
  if(r.err)throw new Error(r.err==="auth"?"Accès refusé":r.err);
  const v=r.ok;if(fn==="bootstrap")marquerVu();
  if(fn==="bootstrap"&&PAGE==="dashboard"&&v&&v.me){if(v.me.role==="commercial"){location.replace("coaching.html");return new Promise(()=>{});}
   if(!v.me.role){const d=ecran();d.querySelector(".b").innerHTML='<h1>Accès réservé</h1><p>Le compte <b>'+(v.me.id||window.__UID)+'</b> n’a pas encore accès au tableau de bord. Demandez à l’équipe Dev Ops de vous ajouter.</p><button onclick="icDeconnexion()" style="padding:10px 18px;border-radius:999px;border:1px solid #433FC1;background:#fff;color:#433FC1;cursor:pointer">Changer de compte</button>';d.classList.add("on");return new Promise(()=>{});}}
  return v;}
 /* chargement anticipé des données, dès l'ouverture, en parallèle du reste de la page */
 if(valide(JETON)){const vu=(()=>{try{return localStorage.getItem("ic_vu_"+window.__UID);}catch(e){return null;}})();
  if(PAGE==="coaching")PREF={fn:"getData",p:api("getData",[])};
  else if(!vu)PREF={fn:"bootstrap",p:api("bootstrap",[null])};
  if(PREF){PREF.p.catch(()=>{});const f=PREF;PREF=null;PREF=f;}}
 const marquerVu=()=>{try{localStorage.setItem("ic_vu_"+window.__UID,"1");}catch(e){}};
 /* google.script.run : même usage que dans Apps Script, mais par Internet */
 const runner=(ok,ko)=>new Proxy({},{get(_,p){if(p==="withSuccessHandler")return f=>runner(f,ko);if(p==="withFailureHandler")return f=>runner(ok,f);if(p==="withUserObject")return()=>runner(ok,ko);
  if(p==="getAppUrl")return()=>setTimeout(()=>ok&&ok(new URL(PAGE==="dashboard"?"coaching.html":"index.html",location.href).href),0);
  return(...a)=>{api(p,a).then(v=>ok&&ok(v),e=>ko&&ko(e));};}});
 const SCRIPT={get run(){return runner(null,null);},url:{getLocation:cb=>cb({parameter:Object.fromEntries(new URLSearchParams(location.search)),hash:location.hash.slice(1)})}};

 let n=0;const iv=setInterval(()=>{garder();if(++n>100)clearInterval(iv);},100); /* la bibliothèque Google peut remplacer l'objet google en se chargeant */
 document.addEventListener("DOMContentLoaded",()=>{const b=document.createElement("button");b.id="icOut";b.textContent="Changer de compte";b.onclick=window.icDeconnexion;document.body.appendChild(b);});
})();

<style>
:root{--bg:#F3F3F8;--card:#FFFFFF;--line:#E2E2EE;--line2:#EEEEF6;--ink:#0D0B4C;--navy:#2A286B;--muted:#5E5D82;--brand:#433FC1;--brand-soft:#ECEBFA;--lost:#D64A35;--lost-soft:#FBEAE6;--amber:#B7791F;--amber-soft:#FBF1DF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.perpill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.avg{display:inline-flex;align-items:baseline;gap:8px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:7px 16px;font-weight:700}.avg b{font-size:22px}.avg span{color:var(--muted)!important;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;margin-top:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.b4{grid-column:span 4}.b5{grid-column:span 5}.b6{grid-column:span 6}.b7{grid-column:span 7}.b12{grid-column:span 12}
.box h3{margin:0 0 12px;font-size:15px}
.cmpk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cmpk div{background:var(--bg);border-radius:12px;padding:12px 14px}.cmpk b{display:block;font-size:26px}.cmpk span{font-size:12.5px;color:var(--muted)}.cmpeq{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(110px,1.3fr) 52px 64px;gap:10px;align-items:center;padding:8px 0;font-size:13.5px}
.axes{margin:0;padding-left:18px}.axes li{margin-bottom:12px}.axes b{display:block}
.tri{border-top:3px solid var(--brand)}.tri.ko{border-top-color:var(--lost)}.tri.pl{border-top-color:var(--navy)}.tri p{margin:0;font-size:13.5px;line-height:1.55}
.saved{list-style:none;margin:0;padding:0}.saved li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line2);font-size:13.5px}.saved li:first-child{border-top:0}.saved .tag{margin:0 6px}
.aibox{margin:16px 0 4px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
@media (max-width:980px){.b4,.b5,.b6,.b7{grid-column:span 12}}
@media (max-width:600px){.cmpk{grid-template-columns:1fr}.srow{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}#mfm,#mfm *{visibility:visible}#mfm{position:absolute;inset:0;max-width:none;box-shadow:none;overflow:visible}.mfm .fm-nav{display:none}.mscrim{display:none}}
.phrase{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--brand-soft);border-left:4px solid var(--brand);font-size:15px;font-weight:600;line-height:1.5;color:var(--ink)}
.phrase b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:4px}
:root{--team:#2A286B}:root[data-theme="dark"]{--team:#DAD9FA}
.bar u{background:var(--team)!important}
.mfm .avg{background:#fff}
/* positif en vert, en cours en violet, blocs distincts */
:root{--cours:#433FC1;--cours-soft:#ECEBFA}:root[data-theme="dark"]{--cours:#B4B2FF;--cours-soft:rgba(180,178,255,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cours:#B4B2FF;--cours-soft:rgba(180,178,255,.16)}}
.tag.cours{background:var(--cours-soft);color:var(--cours)}
.tri.ok{background:var(--brand-soft)}.tri.ko{background:var(--lost-soft)}.tri.pl{background:var(--cours-soft)}.tri.ok h3{color:var(--brand)}.tri.ko h3{color:var(--lost)}.tri.pl h3{color:var(--navy)}
.leg,.lvlegend{display:inline-flex!important;flex-wrap:wrap;gap:12px;background:#fff!important;border:1.5px solid #2A286B!important;border-radius:10px;padding:6px 12px!important;color:#0D0B4C!important}
:root[data-theme="dark"] .leg,:root[data-theme="dark"] .lvlegend{background:#07062B!important;border-color:#DAD9FA!important;color:#fff!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leg,:root:not([data-theme="light"]) .lvlegend{background:#07062B!important;border-color:#DAD9FA!important;color:#fff!important}}
:root[data-theme="dark"] .obtn{background:transparent;border:1.5px solid #DAD9FA;color:#fff}
:root[data-theme="dark"] .phrase{background:rgba(30,158,106,.14);color:#fff}
.mfm h3{margin-top:26px}.mfm .aibox,.mfm .trio,.mfm .cmpk{margin-top:12px}.mfm .lvlbar{margin:8px 0 6px}
.mfm.pip{inset:auto 18px 18px auto!important;width:min(420px,calc(100vw - 36px))!important;height:min(340px,50vh)!important;max-width:none!important;zoom:.72;margin:0}
.eqpill{display:inline-block;padding:2px 9px;border-radius:999px;background:#E3E8F8;color:#2A286B;font-weight:700;font-size:12px}
:root[data-theme="dark"] .eqpill{background:#433FC1;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eqpill{background:#433FC1;color:#fff}}
.lvlbar .g3-track i{background:var(--lvl,var(--brand))!important}.lvlbar .g3-track em{border-color:var(--lvl,var(--brand))!important}.lvlbar .score{color:var(--lvl,var(--brand))!important}
.lv.maitrise{background:#E3F5EC;color:#1E9E6A}.lv.acquisition{background:#FCF1DA!important;color:#A0690A!important}.lv.non_acquis{background:#FBE9E5;color:#BE3C28}.lv.non_evalue{background:transparent!important;border:1.5px dashed #9AA3B5!important;color:var(--muted)!important}
:root[data-theme="dark"] .lv.maitrise{background:rgba(98,232,171,.18);color:#B4B2FF}:root[data-theme="dark"] .lv.acquisition{background:rgba(255,199,90,.2)!important;color:#FFC75A!important}:root[data-theme="dark"] .lv.non_acquis{background:rgba(255,138,117,.2);color:#FF8A75}:root[data-theme="dark"] .lv.non_evalue{border-color:#8F9BC0!important;color:#C9D0E6!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv.acquisition{background:rgba(255,199,90,.2)!important;color:#FFC75A!important}:root:not([data-theme="light"]) .lv.maitrise{background:rgba(98,232,171,.18);color:#B4B2FF}:root:not([data-theme="light"]) .lv.non_acquis{background:rgba(255,138,117,.2);color:#FF8A75}}
.bar{position:relative}.bar u{width:10px!important;height:10px!important;top:50%!important;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--card);box-sizing:border-box}

:root[data-theme="dark"]{--bg:#07062B;--card:#1C1A66;--line:#3D3B94;--line2:#2C2A7A;--ink:#FFFFFF;--navy:#DAD9FA;--muted:#CFCEEE;--brand:#B4B2FF;--brand-soft:#2A286B;--team:#DAD9FA;--pos:#62E8AB;--pos-soft:rgba(98,232,171,.2);--lost:#FF8A75;--lost-soft:rgba(255,138,117,.18);--amber:#FFC75A}

*{font-family:"Inter",Arial,sans-serif!important}
h1,h2,h3{color:var(--navy)}
.phead h1,.phead h2,.phead h3,.fhead b,.fhead h1,.fhead h2,.fhead h3{color:#fff!important}
.fhead,.phead{background:#2A286B!important;border-bottom-color:var(--brand)!important}
.lv.maitrise{background:#E3F5EC!important;color:#1E9E6A!important}
:root[data-theme="dark"] .lv.maitrise{background:rgba(98,232,171,.18)!important;color:#62E8AB!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv.maitrise{background:rgba(98,232,171,.18)!important;color:#62E8AB!important}}
.tag.won{background:var(--pos-soft)!important;color:var(--pos)!important}
.top img.kg{width:auto;height:44px;border-radius:0}.top .kg-d{display:none}
:root[data-theme="dark"] .top .kg-l{display:none}:root[data-theme="dark"] .top .kg-d{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top .kg-l{display:none}:root:not([data-theme="light"]) .top .kg-d{display:block}}
.top span{color:var(--navy)!important;font-weight:600}
#mtip{background:#0D0B4C!important}
/* lisibilité des violets et des pastilles, comme le tableau de bord */
:root{--vtext:#433FC1;--cours:#433FC1;--cours-soft:#E4E3FA}
:root[data-theme="dark"]{--vtext:#B4B2FF;--cours:#B4B2FF;--cours-soft:rgba(180,178,255,.20)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vtext:#B4B2FF;--cours:#B4B2FF;--cours-soft:rgba(180,178,255,.20)}}
[style*="color:var(--brand)"]{color:var(--vtext)!important}
.tag{font-size:12px!important;padding:4px 10px!important;border:1px solid transparent}
.tag.won{background:#E3F5EC!important;color:#1E9E6A!important;border-color:#A5D8C2}
.tag.lost{background:#FADBD4!important;color:#D64A35!important;border-color:#EDA796}
.tag.neu{background:#E2E1F5!important;color:#2A286B!important;border-color:#C3C1EC}
.tag.warn{background:#FBEBC0!important;color:#B7791F!important;border-color:#EBCB73}
.tag.cours{background:var(--cours-soft)!important;color:var(--cours)!important;border-color:#C3C1EC}
:root[data-theme="dark"] .tag.won{background:rgba(98,232,171,.22)!important;color:#62E8AB!important;border-color:rgba(98,232,171,.45)}
:root[data-theme="dark"] .tag.lost{background:rgba(255,138,117,.24)!important;color:#FF8A75!important;border-color:rgba(255,138,117,.45)}
:root[data-theme="dark"] .tag.neu{background:rgba(218,217,250,.20)!important;color:#F2F1FF!important;border-color:rgba(242,241,255,.40)}
:root[data-theme="dark"] .tag.warn{background:rgba(246,200,50,.24)!important;color:#FFC75A!important;border-color:rgba(255,199,90,.45)}
:root[data-theme="dark"] .tag.cours{border-color:rgba(180,178,255,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.won{background:rgba(98,232,171,.22)!important;color:#62E8AB!important;border-color:rgba(98,232,171,.45)}:root:not([data-theme="light"]) .tag.lost{background:rgba(255,138,117,.24)!important;color:#FF8A75!important;border-color:rgba(255,138,117,.45)}:root:not([data-theme="light"]) .tag.neu{background:rgba(218,217,250,.20)!important;color:#F2F1FF!important;border-color:rgba(242,241,255,.40)}:root:not([data-theme="light"]) .tag.warn{background:rgba(246,200,50,.24)!important;color:#FFC75A!important;border-color:rgba(255,199,90,.45)}}
:root{--bar-call-txt:#fff;--bar-won-txt:#fff}:root[data-theme="dark"]{--bar-call-txt:#0D0B4C;--bar-won-txt:#0D0B4C}
.j.on{border-color:#1E9E6A!important;border-width:1.5px;background:linear-gradient(180deg,#E3F5EC,transparent)!important}.j.on .ic{background:#1E9E6A!important;color:#fff!important}
:root[data-theme="dark"] .j.on{border-color:#62E8AB!important;background:linear-gradient(180deg,rgba(98,232,171,.16),transparent)!important;box-shadow:0 0 18px rgba(98,232,171,.18)}:root[data-theme="dark"] .j.on .ic{background:#62E8AB!important;color:#0D0B4C!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .j.on{border-color:#62E8AB!important;background:linear-gradient(180deg,rgba(98,232,171,.16),transparent)!important}:root:not([data-theme="light"]) .j.on .ic{background:#62E8AB!important;color:#0D0B4C!important}}
/* toiles : la moyenne d'équipe en jaune */
:root{--team-radar:#D9A800}:root[data-theme="dark"]{--team-radar:#F6C832}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--team-radar:#F6C832}}
.leg .e::before{background:var(--team-radar)!important}
</style>
</head>

<script>
const STEPS={accroche:"Se présente et explique l’appel",presentation_keobiz:"Présente Keobiz",decouverte:"Pose des questions sur le besoin",reformulation:"Reformule le besoin du prospect",solution:"Propose une offre adaptée",packs:"Présente les packs et leur contenu",pennylane:"Explique l’outil Pennylane",prix:"Annonce le prix",objections:"Répond aux freins",engagement:"Propose de signer ou un devis",prochaine_etape:"Fixe une date pour la suite"};
const SHORT={accroche:"Présentation",presentation_keobiz:"Keobiz",decouverte:"Découverte",reformulation:"Reformulation",solution:"Offre adaptée",packs:"Packs",pennylane:"Pennylane",prix:"Prix",objections:"Freins",engagement:"Signature",prochaine_etape:"Suite datée"};
const SOFT={ecoute_reformulation:"Écoute et reformulation",clarte_concision:"Clarté et concision",adaptation_interlocuteur:"Adaptation à l’interlocuteur",pedagogie:"Pédagogie, vulgarisation",courtoisie:"Courtoisie, ne coupe pas la parole"};
const OBJ={prix:"Le prix",proximite:"Besoin d’un cabinet proche",concurrence:"Compare avec d’autres cabinets",preavis:"Déjà engagé ailleurs",reflexion_decideur:"Veut réfléchir ou en parler",calendrier:"Projet pas encore prêt",confiance:"Manque de confiance",perimetre:"Offre pas adaptée",distance:"Inquiet d’un suivi à distance",reputation:"Doute sur la réputation",autre:"Autre frein"};
const REP={reformulation:"Reformuler le besoin",valeur:"Expliquer ce qui est inclus",comparaison_chiffree:"Comparer les prix en chiffres",geste_commercial:"Faire un geste commercial",preuve:"Rassurer (avis, références)",relance_programmee:"Programmer une relance",pas_de_reponse:"Ne pas répondre au frein"};
const LVL={maitrise:"Maîtrisé",acquisition:"En acquisition",non_acquis:"Non acquis",non_evalue:"Non évalué"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=p=>p===null||p===undefined?"–":p+" %";
let theme="light";try{theme=localStorage.getItem("theme")||"light";}catch(e){}
const applyTheme=t=>{document.documentElement.dataset.theme=t;document.getElementById("theme").textContent=t==="dark"?"☀":"☾";};applyTheme(theme);
document.getElementById("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";applyTheme(theme);try{localStorage.setItem("theme",theme);}catch(e){}};
function niveau(s){if(s===null||s===undefined)return"Pas encore évalué";if(s>=80)return"Excellent niveau";if(s>=60)return"Bon niveau, à consolider";if(s>=40)return"En progression";return"À accompagner";}
function radar(me,eq){const ks=Object.keys(STEPS),n=ks.length,size=300,c=150,r=96,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,rr=r*(v||0)/100;return[c+rr*Math.cos(a),c+rr*Math.sin(a)];};let g="";
 [25,50,75,100].forEach(l=>g+=`<polygon points="${ks.map((_,i)=>pt(i,l).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`);
 ks.forEach((k,i)=>{const[x,y]=pt(i,100),[lx,ly]=pt(i,124);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/><text class="lbl" x="${lx}" y="${ly}" text-anchor="${lx<c-5?"end":lx>c+5?"start":"middle"}" dominant-baseline="middle">${SHORT[k]}</text>`;});
 [[eq,"var(--team-radar)",true],[me,"var(--brand)",false]].forEach(([v,col,d])=>{g+=`<polygon points="${ks.map((k,i)=>pt(i,v[k]).join(",")).join(" ")}" fill="${d?"none":col}" fill-opacity="${d?0:.22}" stroke="${col}" stroke-width="${d?1.8:2.5}"${d?' stroke-dasharray="6 4"':""}/>`;});
 ks.forEach((k,i)=>{const[x,y]=pt(i,me[k]);g+=`<circle cx="${x}" cy="${y}" r="5.5" fill="var(--brand)" stroke="var(--card)" stroke-width="2" style="cursor:help" data-tt="${STEPS[k]} : ${me[k]} % de tes appels (objectif 100 %) · équipe ${eq[k]} %"></circle>`;});
 return `<svg viewBox="-70 -8 ${size+140} ${size+16}" width="100%" style="max-width:440px;display:block;margin:0 auto" role="img" aria-label="Mon profil d’appel comparé à l’équipe">${g}</svg>`;}
function jalons(m,e){const L=[
 ["1","Premiers appels analysés","Avoir au moins un appel analysé.",m.n>=1,Math.min(100,m.n*100)],
 ["2","Découverte maîtrisée","Découverte du besoin maîtrisée dans 70 % des appels.",m.steps.decouverte>=70,m.steps.decouverte/70*100],
 ["3","Besoin reformulé","Reformulation maîtrisée dans 70 % des appels.",m.steps.reformulation>=70,m.steps.reformulation/70*100],
 ["4","Freins bien traités","Lever au moins la moitié des freins soulevés.",(m.lev??0)>=50,(m.lev??0)/50*100],
 ["5","Engagement proposé","Proposer de signer ou un devis dans 70 % des appels.",m.steps.engagement>=70,m.steps.engagement/70*100],
 ["6","Suite toujours datée","Fixer une date pour la suite dans 80 % des appels.",m.steps.prochaine_etape>=80,m.steps.prochaine_etape/80*100],
 ["7","Au-dessus de la moyenne","Taux de transformation supérieur à celui de l’équipe.",(m.g??0)>(e.g??0),(m.g??0)/Math.max(1,e.g)*100],
 ["8","Pédagogie maîtrisée","Vulgariser le jargon comptable dans 70 % des appels.",(m.soft.pedagogie??0)>=70,(m.soft.pedagogie??0)/70*100]];
 return L.map(([ic,t,p,on,pg],k)=>`<div class="j ${on?"on":""}" style="--d:${k}"><div class="ic">${on?"✓":ic}</div><b>${t}</b><p>${p}</p>${on?`<span class="tag won" style="align-self:flex-start">Jalon atteint</span>`:`<div class="pg"><i style="width:${Math.max(4,Math.min(99,Math.round(pg)))}%"></i></div><span class="lowtxt">${Math.min(99,Math.round(pg))} % du chemin</span>`}</div>`).join("");}
function render(s,cards){const m=s.moi,e=s.equipe,p=s.nom.split(" ")[0],got=jalons(m,e).split('class="j on"').length-1;
 document.getElementById("app").innerHTML=`
 <section class="hello"><small>Mon coaching · ${perLabel()}</small><h1 class="n">Bonjour ${esc(p)}</h1><p>Voici ce que l’analyse de tes appels montre sur ${perLabel()}, comparé à la moyenne de l’équipe.</p>${perSelect(months(s.nom))}

  ks.forEach((k,i)=>{const cx=p.l+i*gw+gw/2,v=V[i],bar=(val,w,c)=>val?`<rect x="${cx-w/2}" y="${y(val)}" width="${w}" height="${Hh-p.b-y(val)}" rx="${Math.min(4,w/3)}" fill="${c}"></rect>`:"";
   g+=`<g data-tt="Semaine du ${fd(k)}${leads?` · ${v.l} leads affectés`:""} · ${v.a} appels analysés · ${v.g} deals gagnés">`+(leads?bar(v.l,gw*.78,C.l):"")+bar(v.a,gw*.5,C.a)+bar(v.g,gw*.24,C.g)+etq(cx,v,leads,y,gw)+`<rect x="${p.l+i*gw}" y="${p.t}" width="${gw}" height="${ih}" fill="transparent"></rect></g>`;
   if(i%Math.max(1,Math.ceil(n/10))===0)g+=`<text x="${cx}" y="${Hh-p.b+16}" text-anchor="middle">${k.slice(8,10)}/${k.slice(5,7)}</text>`;});
  const chip=(c,val,lab)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px"><i style="min-width:20px;height:20px;border-radius:5px;background:${c};display:inline-grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:${c==="var(--bar-lead)"?"var(--ink)":c==="var(--bar-won)"?"var(--bar-won-txt)":"var(--bar-call-txt)"}">${lab.charAt(0).toUpperCase()}</i><div><b style="font-size:19px">${val.toLocaleString("fr-FR")}</b><div class="lowtxt" style="margin:0">${lab}</div></div></div>`;
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px">${leads?chip(C.l,T.l,"leads affectés"):""}${chip(C.a,T.a,"appels analysés")}${chip(C.g,T.g,"deals gagnés")}</div><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Activité par semaine">${g}</svg><p class="lowtxt" style="margin:6px 0 0">Barres imbriquées : leads affectés (fond), appels analysés (milieu), deals gagnés (centre).</p>`;};})();
</script>
<div id="mtip" role="tooltip"></div>
<script>
(function(){const t=document.getElementById("mtip");
 document.addEventListener("mouseover",e=>{const c=e.target.closest("[data-tt]");if(!c)return;t.textContent=c.dataset.tt;t.style.display="block";const r=c.getBoundingClientRect();t.style.left=Math.max(8,Math.min(innerWidth-t.offsetWidth-8,r.left+r.width/2-t.offsetWidth/2))+"px";t.style.top=Math.max(8,r.top-t.offsetHeight-10)+"px";});
 document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tt]"))t.style.display="none";});

</script>
<script>
/* activité par semaine : trois colonnes côte à côte par semaine, chiffre au-dessus (comme le tableau de bord) */
(function(){const cle=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]+/g," ").trim().split(" ").filter(Boolean).sort().join(" ");
 const wk=d=>{const x=new Date(String(d).slice(0,10)+"T12:00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10);};
 window.weekSvg=function(R){const H=(DATA&&DATA.hebdo)||null,me=cle(CUR?CUR.nom:""),m={};R.forEach(r=>{const k=wk(r.date);(m[k]=m[k]||[]).push(r);});
  const w0=R.length?wk(R.map(r=>String(r.date).slice(0,10)).sort()[0]):null,pick=T=>{const o={};Object.keys(T||{}).forEach(w=>{if(w0&&w<w0)return;const v=(T[w]||{})[me];if(v)o[w]=v;});return o;};
  const leads=H&&H.leads_dispo?pick(H.leads):null,gSF=H?pick(H.gagnes):null,ks=[...new Set([...Object.keys(m),...Object.keys(leads||{}),...Object.keys(gSF||{})])].sort();
  if(!ks.length)return "<p class='lowtxt'>Pas encore d’appel analysé sur la période.</p>";
  const V=ks.map(k=>({l:leads?(leads[k]||0):null,a:(m[k]||[]).length,g:gSF?(gSF[k]||0):(m[k]||[]).filter(r=>r.resultat==="Gagné").length})),T={a:0,l:0,g:0};V.forEach(v=>{T.a+=v.a;T.l+=v.l||0;T.g+=v.g;});
 const mx=Math.max(1,...V.flatMap(v=>[v.a,v.l||0,v.g]));
 const S=[...(leads?[["l","var(--bar-lead-solid)","leads affectés"]]:[]),["a","var(--bar-call)","appels analysés"],["g","var(--bar-won)","deals gagnés"]];
 const W=1100,Hh=300,p={l:56,r:60,t:18,b:30},n=ks.length,gw=(W-p.l-p.r)/Math.max(1,n-1),ih=Hh-p.t-p.b,X=i=>n===1?p.l+(W-p.l-p.r)/2:p.l+i*gw,Y=v=>Hh-p.b-ih*Math.sqrt(Math.max(0,v))/Math.sqrt(mx);let s="";
 const nice=x=>{if(x<=0)return 0;const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e;};
 const ticks=[...new Set([0,...[1,2,3].map(k=>nice(mx*k*k/16)).filter(t=>t>=1&&Number.isInteger(t)&&t<mx*0.8),mx])];
 ticks.forEach(t=>{const yy=Y(t);s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}" stroke="var(--line2)"/><text x="${p.l-6}" y="${yy}" text-anchor="end" dominant-baseline="middle">${t.toLocaleString("fr-FR")}</text>`;});
 ks.forEach((k,i)=>{if(i%Math.max(1,Math.ceil(n/10))===0)s+=`<text x="${X(i)}" y="${Hh-p.b+16}" text-anchor="middle">${k.slice(8,10)}/${k.slice(5,7)}</text>`;});
 const showAll=n<=8,occ={};
 S.forEach(([key,c])=>{const pts=V.map((v,i)=>[X(i),Y(v[key]||0)]);s+=`<polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(([x,yy],i)=>{s+=`<circle cx="${x}" cy="${yy}" r="${i===n-1?4.5:3.2}" fill="${c}" stroke="var(--card)" stroke-width="1.5"/>`;const ly=yy-8,pris=(occ[i]=occ[i]||[]);if(showAll&&i<n-1&&V[i][key]&&i>0&&!pris.some(o=>Math.abs(o-ly)<12)){pris.push(ly);s+=`<text x="${x}" y="${ly}" text-anchor="middle" style="font-size:11px;font-weight:500;fill:var(--muted)">${V[i][key]}</text>`;}});
  const last=V[n-1][key]||0;s+=`<text x="${X(n-1)+9}" y="${Y(last)}" dominant-baseline="middle" style="font-size:12px;font-weight:600;fill:var(--ink)">${last}</text>`;});
 ks.forEach((k,i)=>{const x0=n===1?p.l:X(i)-gw/2,w=n===1?W-p.l-p.r:gw;s+=`<rect x="${Math.max(p.l-6,x0)}" y="${p.t}" width="${w}" height="${ih}" fill="transparent" data-tt="Semaine du ${fd(k)}${leads?` · ${V[i].l} leads affectés`:""} · ${V[i].a} appels analysés · ${V[i].g} deals gagnés"></rect>`;});
  const chip=(c,val,lab)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px"><i style="width:14px;height:14px;border-radius:4px;background:${c};display:inline-block"></i><div><b style="font-size:19px">${val.toLocaleString("fr-FR")}</b><div class="lowtxt" style="margin:0">${lab}</div></div></div>`;
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px">${S.map(([key,c,lab])=>chip(c,T[key],lab)).join("")}</div><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Activité par semaine">${s}</svg><p class="lowtxt" style="margin:6px 0 0">Survole une semaine pour ses chiffres.</p>`;};
 const st=document.createElement("style");st.textContent=':root{--bar-lead-solid:#A9A6E8;--week-band:rgba(42,40,107,.045)}:root[data-theme="dark"]{--bar-lead-solid:#8E8CC4;--week-band:rgba(255,255,255,.05)}';document.head.appendChild(st);})();
</script>
